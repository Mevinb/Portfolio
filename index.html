
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Discovered in the initial HTML, not behind the CSS bundle: an @import
         chain would serialize app CSS -> font CSS -> WOFF2 on the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Hero portrait is the LCP element; fetch it alongside the JS bundle
         instead of waiting for React to mount and discover the <picture>. -->
    <link
      rel="preload"
      as="image"
      href="/images/mevin-portrait.webp"
      imagesrcset="/images/mevin-portrait-400.webp 400w, /images/mevin-portrait.webp 706w"
      imagesizes="(min-width: 1024px) 430px, 90vw"
      type="image/webp"
      fetchpriority="high"
    />

    <!--seo-head-->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <noscript><style>
      #root [style*="opacity:0"] { opacity: 1 !important; }
      #root [style*="transform:"] { transform: none !important; }
    </style></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
